name: CI

on:
  push:
    branches: [main, abhi, v2.0]
  pull_request:

jobs:
  server:
    name: Server — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

  client:
    name: Client — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # `npm run build` runs `tsc -b` (real typecheck of the solution — plain
      # `tsc --noEmit` on the solution file checks zero files) + vite build.
      - run: npm run build
      # NOTE: `npm run lint` is intentionally not gated yet — there are ~50
      # pre-existing lint findings to clean up first (tracked in IMPROVEMENT_PLAN).
